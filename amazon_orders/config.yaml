---
name: Amazon Orders
version: "0.1.0"
slug: amazon_orders
description: >-
  Read-only Amazon order history: search, return and warranty deadlines,
  spending statistics, Home Assistant sensors, events and a deadlines calendar.
url: https://github.com/CristianoCorsi/ha-amazon-orders
arch:
  - aarch64
  - amd64
image: ghcr.io/cristianocorsi/{arch}-addon-amazon-orders
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:package-variant-closed
panel_title: Amazon Orders
homeassistant_api: true
services:
  - mqtt:want
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: Sign-in page for Amazon (only open it while signing in)
watchdog: http://[HOST]:[PORT:8099]/api/status
options:
  sync_preset: careful
  recent_refresh_hours: 6
  backfill_until_year: ""
  return_thresholds:
    - 7
    - 2
    - 0
  warranty_thresholds:
    - 180
    - 90
    - 60
    - 30
    - 14
    - 5
  default_warranty_months: 24
  mqtt: {}
  log_level: info
  login_port: 8098
schema:
  sync_preset: list(careful|moderate)
  recent_refresh_hours: float(0.25,)
  backfill_until_year: str?
  return_thresholds:
    - int(0,)
  warranty_thresholds:
    - int(0,)
  default_warranty_months: int(1,)
  mqtt:
    host: str?
    port: port?
    username: str?
    password: password?
  domain: str?
  log_level: list(debug|info|warning|error)
  login_port: port
  login_host: str?
